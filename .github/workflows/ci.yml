name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Assert package contract
        run: |
          php -r '
            $json = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $constraint = $json["require"]["php"] ?? "";
            if ($constraint !== "^8.5") {
                fwrite(STDERR, "Expected composer.php ^8.5, got: {$constraint}\n");
                exit(1);
            }
            if (($json["type"] ?? "") !== "library") {
                fwrite(STDERR, "Expected type library\n");
                exit(1);
            }
            if (($json["name"] ?? "") !== "ereborcodeforge/durin-installer") {
                fwrite(STDERR, "Unexpected package name\n");
                exit(1);
            }
            if (!in_array("bin/durin", $json["bin"] ?? [], true)) {
                fwrite(STDERR, "composer.json must expose bin/durin\n");
                exit(1);
            }
            foreach (["ereborcodeforge/durin-core", "ereborcodeforge/durin-presets", "ereborcodeforge/durin-architecture", "ereborcodeforge/durin-app"] as $forbidden) {
                if (isset($json["require"][$forbidden]) || isset($json["require-dev"][$forbidden])) {
                    fwrite(STDERR, "Installer must not depend on {$forbidden}\n");
                    exit(1);
                }
            }
            if (PHP_VERSION_ID < 80500) {
                fwrite(STDERR, "CI must run on PHP 8.5+, got: " . PHP_VERSION . "\n");
                exit(1);
            }
            echo "PHP " . PHP_VERSION . " / composer php {$constraint}\n";
          '

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Assert bin executable
        run: |
          test -f bin/durin
          test -x bin/durin

      - name: Run tests
        run: composer test

      - name: CLI smoke
        run: |
          bin/durin --help
          bin/durin --version
          bin/durin help
